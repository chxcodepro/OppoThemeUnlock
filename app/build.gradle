plugins {
    id 'com.android.application'
}

// 发布签名：仅当 CI 通过 secrets 注入了完整凭据时才启用。
// 本地构建没有这些环境变量，会自动退回 debug 签名，不影响开发。
def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
def releaseSigningReady = [releaseStoreFile, releaseKeyAlias, releaseStorePassword, releaseKeyPassword]
        .every { v -> v != null && !v.trim().isEmpty() }

android {
    namespace 'io.github.oppotheme.unlock'

    // 本机仅安装 android-36；AGP 8.5 对 36 只告警不报错。
    // CI 上装的是 34，两者都能编译。
    compileSdk 36

    defaultConfig {
        applicationId "io.github.oppotheme.unlock"
        minSdk 28
        // 目标商店本身 targetSdk 35，模块保持 34 避免新行为变更引入干扰
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                keyAlias releaseKeyAlias
                storePassword releaseStorePassword
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            // 模块只注入目标进程，混淆没有收益，反而让崩溃栈难以阅读
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // 固定产物名，供 Actions 直接引用，避免依赖默认命名
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "OppoThemeUnlock-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // 仅编译期需要，运行期 API 由 LSPosed 框架注入
    compileOnly 'de.robv.android.xposed:api:82'
}
