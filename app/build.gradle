plugins {
    alias(libs.plugins.android.application)
}

def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
def releaseSigningReady = [
        releaseStoreFile,
        releaseKeyAlias,
        releaseStorePassword,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'com.example.oppo_theme'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.oppo_theme"
        minSdk 28
        targetSdk 34
        versionCode 6
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                keyAlias releaseKeyAlias
                storePassword releaseStorePassword
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "OppoOPlusThemeUnlock-0.1.apk"
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
