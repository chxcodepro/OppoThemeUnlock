name: Build LSPosed module

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build APK and run lint
        run: ./gradlew --no-daemon clean assembleDebug lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OppoOPlusThemeUnlock
          path: app/build/outputs/apk/debug/OppoOPlusThemeUnlock-0.1.apk
          if-no-files-found: error
          retention-days: 14

      - name: Detect release signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" \
             && -n "$RELEASE_KEY_ALIAS" \
             && -n "$RELEASE_STORE_PASSWORD" \
             && -n "$RELEASE_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: OppoOPlusThemeUnlock-release
          path: app/build/outputs/apk/release/OppoOPlusThemeUnlock-0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Select release APK
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_apk
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            apk="$RUNNER_TEMP/OppoOPlusThemeUnlock-0.1.apk"
            cp app/build/outputs/apk/release/OppoOPlusThemeUnlock-0.1.apk "$apk"
            echo "build_kind=release-signed" >> "$GITHUB_OUTPUT"
          else
            apk="$RUNNER_TEMP/OppoOPlusThemeUnlock-0.1.apk"
            cp app/build/outputs/apk/debug/OppoOPlusThemeUnlock-0.1.apk "$apk"
            echo "build_kind=default-signed" >> "$GITHUB_OUTPUT"
          fi
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.release_apk.outputs.apk_path }}
          BUILD_KIND: ${{ steps.release_apk.outputs.build_kind }}
        shell: bash
        run: |
          echo "Publishing $BUILD_KIND APK: $APK_PATH"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
